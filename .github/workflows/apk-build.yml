name: APK Build

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon || (sudo apt-get update -y && sudo apt-get install -y gradle && gradle assembleDebug --no-daemon)
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroesGPT-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x gradlew || true
          if [ -f gradlew ]; then
            ./gradlew clean assembleRelease --no-daemon
          else
            gradle clean assembleRelease --no-daemon || (sudo apt-get update -y && sudo apt-get install -y gradle && gradle clean assembleRelease --no-daemon)
          fi
          ls -la app/build/outputs/apk/release/

      - name: Publish release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
