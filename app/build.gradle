plugins {
    id 'com.android.application'
}

android {
    namespace 'com.heroes.gpt'
    compileSdk 34

    aaptOptions {
        ignoreAssetsPattern '!.svn:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    defaultConfig {
        applicationId "com.heroes.gpt"
        minSdk 24
        targetSdk 34
        versionCode 17
        versionName "6.5"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
