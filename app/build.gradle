plugins {
    id 'com.android.application'
}

android {
    namespace 'com.heroes.gpt'
    compileSdk 34

    signingConfigs {
        heroes {
            storeFile rootProject.file('keystore/heroes.jks')
            storePassword 'HeroesGPT2026'
            keyAlias 'heroes'
            keyPassword 'HeroesGPT2026'
        }
    }

    aaptOptions {
        ignoreAssetsPattern '!.svn:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    defaultConfig {
        applicationId "com.heroes.gpt"
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName "6.9"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.heroes
        }
        debug {
            signingConfig signingConfigs.heroes
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
