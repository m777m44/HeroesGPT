[tool.poetry]
name = "tinker-nemogym"
version = "0.1.0"
description = "Bridge between NVIDIA NeMo-Gym RL environments and Thinking Machines Tinker"
authors = ["Nous Research"]
readme = "README.md"
license = "MIT"
packages = [{include = "tinker_nemogym"}]
include = [
    # PEP 561 inline-types marker — signals to type checkers that downstream
    # consumers can rely on this package's inline annotations.
    "tinker_nemogym/py.typed",
]

[tool.poetry.dependencies]
python = "^3.12"
tinker = ">=0.18.0"
tinker-cookbook = ">=0.3.0"
nemo-gym = {path = "../nemo-gym", develop = true}
fastapi = ">=0.118"
uvicorn = ">=0.35"
aiohttp = ">=3.12"
pydantic = ">=2.11"
pyyaml = ">=6.0"
click = ">=8.3"
tqdm = ">=4.67"
wandb = ">=0.21"
transformers = ">=4.50"
numpy = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.25"
pytest-httpx = ">=0.35"
ruff = ">=0.8"
mypy = ">=1.13"
types-PyYAML = ">=6.0"

[tool.poetry.scripts]
tinker-nemogym-train = "tinker_nemogym.cli:train"
tinker-nemogym-serve = "tinker_nemogym.cli:serve"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true  # our deps (tinker_cookbook, nemo_gym, aiohttp ext) lack stubs
warn_redundant_casts = true
warn_unreachable = true
