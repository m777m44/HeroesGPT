# nemo-gym SimpleAgent + policy_model for the `tng_json_format` env. The
# policy_model re-points at our shim (same rationale as nemogym_mcqa_agent.yaml):
# the agent talks OpenAI-compatible to 127.0.0.1:8001 which serve.py bridges
# to the Tinker sampling client.

policy_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: http://127.0.0.1:8001/v1
      openai_api_key: tinker-nemogym-shim
      openai_model: tinker
      extra_body: {}

tng_json_format_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: tng_json_format
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        # The prompts live in tinker-nemogym, not in nemo-gym's resources_server
        # (same pattern as nemogym_mcqa_agent.yaml — the trainer reads the
        # JSONL directly from disk for GRPO grouping, nemo-gym only grades).
        # Path resolved relative to the nemo-gym repo root (ng_run's cwd).
        jsonl_fpath: ../tinker-nemogym/tinker_nemogym/environments/json_format/dataset.jsonl
