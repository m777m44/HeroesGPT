# Top-level tinker-nemogym live-run config for nemo-gym's `mcqa`
# environment. Varied-reward single-turn (unlike example_single_tool_call which
# always returns 1.0). With drop_constant_reward: true we only train on groups
# that actually have non-zero advantage.
#
# Run via:
#     bash scripts/smoke_mcqa.sh

schema_version: 1

tinker:
  base_model: meta-llama/Llama-3.1-8B-Instruct
  lora_rank: 32
  learning_rate: 5.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-12
  loss_fn: importance_sampling
  wandb_project: null
  wandb_name: null
  checkpoint_dir: ./checkpoints/smoke_mcqa
  resume_from_checkpoint: null

model_server:
  host: 127.0.0.1
  port: 8001
  stop_tokens: []

nemogym:
  # Leave agent_url null so the trainer discovers the agent port dynamically
  # via the HeadServer's /server_instances endpoint.
  agent_url: null
  head_url: http://127.0.0.1:11000
  dataset_jsonl: tinker_nemogym/environments/mcqa/dataset.jsonl
  # group_size=8 at T=1.0 gives more within-group reward variance than 4;
  # with 10 multi-choice options a competent 8B often gets ~50-80% right,
  # so small groups tend to collapse to constant (all-right or all-wrong).
  group_size: 8
  ng_run_yamls: []

training:
  n_steps: 5
  batch_size: 2
  max_tokens: 256
  temperature: 1.0
  save_every: 2
  eval_every: 100
  # Default for varied-reward envs: only train on groups with reward variance.
  drop_constant_reward: true
  # Opt-in precision-gap (β) diagnostics — runs an extra trainer-side
  # forward pass per step to diff against sampler-side logprobs. See
  # docs/diagnostics.md and the HuggingFace BF16-mismatch paper:
  # https://huggingface.co/spaces/aminediroHF/trainer-generator-bf16-mismatch
  # Leave false in production; flip to true when auditing a new base model.
  measure_precision_gap: false
