<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #f3f1ec; }
  svg { display: block; }
  .sans { font-family: "Helvetica Neue", Helvetica, sans-serif; }
  .mono { font-family: "Berkeley Mono Variable", "Berkeley Mono", monospace; }
  .ink { fill: #17171a; }
  .muted { fill: #6f6e72; }
  .accent { fill: #e0592a; }
  .box { fill: #fbfaf7; stroke: #d9d5cb; stroke-width: 1.5; }
  .line { stroke: #17171a; stroke-width: 1.75; fill: none; }
  .loop { stroke: #e0592a; stroke-width: 2.25; fill: none; }
</style>
</head>
<body>
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17171a" />
    </marker>
    <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0592a" />
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#f3f1ec" />

  <text x="64" y="92" class="sans ink" font-size="40" font-weight="500" letter-spacing="-0.4">How an agent makes a phone call</text>

  <!-- Nodes -->
  <rect x="64" y="140" width="200" height="110" rx="14" class="box" />
  <text x="88" y="186" class="sans ink" font-size="26" font-weight="500">Your agent</text>
  <text x="88" y="220" class="mono muted" font-size="16">OpenCode · MCP</text>

  <rect x="470" y="140" width="220" height="110" rx="14" class="box" />
  <text x="494" y="186" class="sans ink" font-size="26" font-weight="500">Call job</text>
  <text x="494" y="220" class="mono muted" font-size="16">on Cloudflare</text>

  <rect x="896" y="140" width="240" height="110" rx="14" class="box" />
  <text x="920" y="186" class="sans ink" font-size="26" font-weight="500">Restaurant</text>
  <text x="920" y="220" class="mono muted" font-size="16">picks up the phone</text>

  <rect x="896" y="310" width="240" height="110" rx="14" class="box" />
  <text x="920" y="356" class="sans ink" font-size="26" font-weight="500">Grok Voice 3.0</text>
  <text x="920" y="390" class="mono muted" font-size="16">does the talking</text>

  <!-- Main flow -->
  <line x1="266" y1="180" x2="466" y2="180" class="line" marker-end="url(#head)" />
  <text x="367" y="168" class="mono ink" font-size="16" text-anchor="middle">start(brief)</text>

  <line x1="468" y1="218" x2="268" y2="218" class="line" marker-end="url(#head)" />
  <text x="367" y="242" class="mono ink" font-size="16" text-anchor="middle">report + transcript</text>

  <line x1="692" y1="195" x2="892" y2="195" class="line" marker-end="url(#head)" />
  <text x="792" y="183" class="mono ink" font-size="16" text-anchor="middle">Twilio dials</text>

  <line x1="1016" y1="252" x2="1016" y2="306" class="line" marker-start="url(#head)" marker-end="url(#head)" />
  <text x="1002" y="284" class="mono ink" font-size="16" text-anchor="end">joins over SIP</text>

  <!-- Mid-call question loop -->
  <path d="M892,365 L164,365 L164,254" class="loop" marker-start="url(#head-accent)" marker-end="url(#head-accent)" />
  <line x1="580" y1="252" x2="580" y2="365" class="loop" />
  <circle cx="580" cy="365" r="5" fill="#e0592a" />
  <text x="528" y="402" class="sans accent" font-size="20" text-anchor="middle">Questions reach your agent mid-call, and its answer goes straight back</text>

  <!-- Example call -->
  <rect x="64" y="452" width="1072" height="396" rx="16" class="box" />

  <text x="104" y="508" class="mono muted" font-size="18">Them</text>
  <text x="264" y="508" class="sans ink" font-size="24">Friday at 7 is full. I can do 8:15, or Saturday at 7.</text>

  <text x="104" y="562" class="mono muted" font-size="18">Grok</text>
  <text x="264" y="562" class="sans ink" font-size="24">One sec, let me just check with him.</text>

  <text x="104" y="616" class="mono accent" font-size="18">Question</text>
  <text x="264" y="616" class="sans accent" font-size="24">Friday at 7 is full. 8:15 Friday, or 7 Saturday?</text>

  <text x="104" y="670" class="mono accent" font-size="18">Answer</text>
  <text x="264" y="670" class="sans accent" font-size="24">Saturday at 7 works.</text>

  <text x="104" y="724" class="mono muted" font-size="18">Grok</text>
  <text x="264" y="724" class="sans ink" font-size="24">Okay, Saturday at seven works. Can you put that under Ryan?</text>

  <line x1="104" y1="760" x2="1096" y2="760" stroke="#e2ded4" stroke-width="1.5" />

  <text x="104" y="808" class="mono ink" font-size="18" font-weight="600">Report</text>
  <text x="264" y="808" class="sans ink" font-size="24">Booked Saturday at 7 pm, table for 4, under Ryan Vogel.</text>
</svg>
</body>
</html>
